name: Supabase Free Keepalive

on:
  schedule:
    # Run every 2 days at 04:00 UTC to prevent Supabase Free 7-day inactivity pause
    - cron: '0 4 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint to Query Database
        run: |
          TARGET_URL="${{ secrets.APP_URL }}"
          if [ -z "$TARGET_URL" ]; then
            echo "APP_URL secret is not set. Skipping keepalive ping."
            exit 0
          fi
          FULL_URL="${TARGET_URL%/}/api/health"
          echo "Sending keepalive query to $FULL_URL"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -H "User-Agent: GitHubActions-Keepalive/1.0" "$FULL_URL")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Supabase keepalive ping succeeded."
